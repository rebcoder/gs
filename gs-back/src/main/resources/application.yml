spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicTypeDescriptor: TRACE

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope: profile, email
            redirect-uri: "${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}"
  main:
    allow-circular-references: true

server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET:myVeryLongSecretKeyThatIsAtLeast512BitsLongForJWTTokenSigningPurposesAndShouldBeChangedInProductionEnvironment}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

# Other custom configurations can be added below
