name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gs-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: ./mvnw -B test

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gs-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gs-front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Production build
        run: npx ng build --configuration production --progress=false
